# Sobe a aplicação completa: banco PostgreSQL + API + proxy HTTPS (Caddy).
# Antes de subir, copie .env.example para .env e preencha as variáveis.
#
#   docker compose up -d --build
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diagnostico
      POSTGRES_USER: diagnostico
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagnostico"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://diagnostico:${DB_PASSWORD}@db:5432/diagnostico
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  # Proxy reverso com HTTPS automático (Let's Encrypt).
  # Defina DOMINIO no .env (ex.: diagnostico.suaescola.com.br) apontando para o servidor.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
